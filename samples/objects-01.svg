<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a7ad1"/>
      <stop offset="1" stop-color="#2b4a86"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3d67b5"/>
      <stop offset="1" stop-color="#22407a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="book1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e74c3c"/><stop offset="1" stop-color="#b02a2a"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2ecc71"/><stop offset="1" stop-color="#1e8a4d"/>
    </linearGradient>
    <linearGradient id="book3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1c40f"/><stop offset="1" stop-color="#b8910a"/>
    </linearGradient>
    <linearGradient id="book4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9b59b6"/><stop offset="1" stop-color="#6a3a85"/>
    </linearGradient>
  </defs>

  <!-- shoulder straps (behind) -->
  <path d="M105 130 Q95 180 108 230 L130 230 Q120 180 128 130 Z" fill="url(#bag)"/>
  <path d="M295 130 Q305 180 292 230 L270 230 Q280 180 272 130 Z" fill="url(#bag)"/>

  <!-- top handle -->
  <path d="M175 80 Q175 45 200 45 Q225 45 225 80" fill="none" stroke="#2b3d66" stroke-width="8" stroke-linecap="round"/>

  <!-- backpack interior (dark, behind books) -->
  <rect x="120" y="90" width="160" height="60" rx="10" fill="#1a2a4a"/>

  <!-- books peeking out -->
  <g>
    <!-- red book -->
    <rect x="130" y="60" width="30" height="90" rx="3" fill="url(#book1)"/>
    <rect x="130" y="60" width="30" height="8" fill="#fff" opacity="0.35"/>
    <rect x="135" y="95" width="20" height="3" fill="#fff" opacity="0.5"/>
    <rect x="138" y="105" width="14" height="2" fill="#fff" opacity="0.4"/>

    <!-- green book -->
    <rect x="163" y="40" width="28" height="110" rx="3" fill="url(#book2)"/>
    <rect x="163" y="40" width="28" height="8" fill="#fff" opacity="0.35"/>
    <rect x="168" y="80" width="18" height="3" fill="#fff" opacity="0.5"/>
    <rect x="170" y="95" width="14" height="2" fill="#fff" opacity="0.4"/>

    <!-- yellow book (tilted) -->
    <g transform="rotate(-8 215 95)">
      <rect x="195" y="50" width="26" height="95" rx="3" fill="url(#book3)"/>
      <rect x="195" y="50" width="26" height="8" fill="#fff" opacity="0.4"/>
      <rect x="200" y="90" width="16" height="3" fill="#fff" opacity="0.5"/>
    </g>

    <!-- purple book -->
    <rect x="228" y="55" width="28" height="95" rx="3" fill="url(#book4)"/>
    <rect x="228" y="55" width="28" height="8" fill="#fff" opacity="0.35"/>
    <rect x="233" y="95" width="18" height="3" fill="#fff" opacity="0.5"/>
    <rect x="235" y="110" width="14" height="2" fill="#fff" opacity="0.4"/>
  </g>

  <!-- backpack body -->
  <path d="M90 130 Q90 115 105 115 L295 115 Q310 115 310 130 L310 320 Q310 345 285 345 L115 345 Q90 345 90 320 Z"
        fill="url(#bag)"/>

  <!-- zipper line at top -->
  <line x1="115" y1="140" x2="285" y2="140" stroke="#1a2a4a" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- shading overlay -->
  <path d="M90 130 Q90 115 105 115 L295 115 Q310 115 310 130 L310 320 Q310 345 285 345 L115 345 Q90 345 90 320 Z"
        fill="url(#shade)"/>

  <!-- front pocket -->
  <rect x="125" y="210" width="150" height="115" rx="14" fill="url(#pocket)" stroke="#1a2a4a" stroke-width="1.5"/>

  <!-- pocket zipper -->
  <line x1="140" y1="228" x2="260" y2="228" stroke="#1a2a4a" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="262" cy="228" r="4" fill="#d4d4d4" stroke="#1a2a4a" stroke-width="1"/>

  <!-- logo patch -->
  <rect x="180" y="258" width="40" height="30" rx="3" fill="#f5efe0" stroke="#1a2a4a" stroke-width="1"/>
  <text x="200" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#22407a">BOOKS</text>

  <!-- stitching lines -->
  <path d="M100 130 L100 330" stroke="#fff" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>
  <path d="M300 130 L300 330" stroke="#fff" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- side buckles -->
  <rect x="82" y="200" width="14" height="40" rx="3" fill="#2b3d66"/>
  <rect x="304" y="200" width="14" height="40" rx="3" fill="#2b3d66"/>

  <!-- highlight on body -->
  <path d="M110 140 Q105 220 115 330" stroke="#fff" stroke-width="3" opacity="0.15" fill="none"/>
</svg>