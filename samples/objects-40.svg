<svg id="longboard-svg" width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Wood Gradient -->
                    <linearGradient id="deckGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#8B4513" id="grad-stop-1" />
                        <stop offset="50%" stop-color="#A0522D" id="grad-stop-2" />
                        <stop offset="100%" stop-color="#8B4513" id="grad-stop-3" />
                    </linearGradient>

                    <!-- Wheel Gradient (Dynamic) -->
                    <radialGradient id="wheelGradient" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" id="wheel-highlight"/>
                        <stop offset="100%" stop-color="#333333" id="wheel-base"/>
                    </radialGradient>

                    <!-- Grip Tape Texture -->
                    <pattern id="patternGrip" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
                        <rect width="4" height="4" fill="#111111"/>
                        <circle cx="2" cy="2" r="1" fill="#333333"/>
                    </pattern>
                    
                    <!-- Wood Grain Texture -->
                    <pattern id="patternWood" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                        <rect width="100" height="100" fill="url(#deckGradient)"/>
                        <path d="M0 10 Q 50 20 100 10 M0 30 Q 50 40 100 30 M0 50 Q 50 60 100 50" stroke="rgba(0,0,0,0.1)" stroke-width="1" fill="none"/>
                    </pattern>

                    <!-- Metallic Truck Gradient -->
                    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#9ca3af" />
                        <stop offset="50%" stop-color="#d1d5db" />
                        <stop offset="100%" stop-color="#6b7280" />
                    </linearGradient>

                    <!-- Shadow -->
                    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                        <feOffset dx="0" dy="20" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.5"/>
                        </feComponentTransfer>
                        <feMerge> 
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/> 
                        </feMerge>
                    </filter>
                    
                    <!-- Wheel Rotation Transform Origin -->
                    <g id="single-wheel">
                        <circle cx="0" cy="0" r="35" fill="url(#wheelGradient)" stroke="#000" stroke-width="1"/>
                        <!-- Wheel Hub Detail -->
                        <circle cx="0" cy="0" r="15" fill="#444" stroke="#666" stroke-width="2"/>
                        <rect x="-10" y="-3" width="20" height="6" fill="#333" rx="1" transform="rotate(45)"/>
                        <rect x="-10" y="-3" width="20" height="6" fill="#333" rx="1" transform="rotate(-45)"/>
                    </g>
                </defs>

                <!-- Main Group for Whole Board Transformations -->
                <g id="board-assembly" transform="translate(100, 50)">
                    
                    <!-- Drop Shadow underneath -->
                    <ellipse cx="400" cy="140" rx="380" ry="30" fill="black" opacity="0.3" filter="url(#dropShadow)"/>

                    <!-- Rear Truck & Wheels -->
                    <g id="rear-assembly" transform="translate(150, 130)">
                        <!-- Kingpin/Truck Base -->
                        <path d="M-40 0 L40 0 L30 -40 L-30 -40 Z" fill="url(#metalGradient)" />
                        <!-- Hanger -->
                        <rect x="-50" y="-5" width="100" height="15" fill="#555" rx="5" />
                        <!-- Rear Wheels -->
                        <use href="#single-wheel" x="-45" y="10" />
                        <use href="#single-wheel" x="45" y="10" />
                    </g>

                    <!-- Front Truck & Wheels -->
                    <g id="front-assembly" transform="translate(650, 130)">
                        <path d="M-40 0 L40 0 L30 -40 L-30 -40 Z" fill="url(#metalGradient)" />
                        <rect x="-50" y="-5" width="100" height="15" fill="#555" rx="5" />
                        <!-- Front Wheels -->
                        <use href="#single-wheel" x="-45" y="10" />
                        <use href="#single-wheel" x="45" y="10" />
                    </g>

                    <!-- The Deck -->
                    <g id="deck-group">
                        <!-- Main Board Shape (Top Layer - Grip/Bottom) -->
                        <path id="deck-surface" 
                              d="M 0 20 
                                 C 0 20, 100 80, 200 90 
                                 L 600 90 
                                 C 700 80, 800 20, 800 20 
                                 C 800 -10, 720 -30, 680 -20 
                                 L 120 -20 
                                 C 80 -30, 0 -10, 0 20 Z" 
                              fill="url(#deckGradient)" 
                              stroke="rgba(0,0,0,0.5)" stroke-width="1"/>
                        
                        <!-- Art Overlay / Decal -->
                        <path id="deck-art" 
                              d="M 120 -10 L 680 -10 C 680 -10, 650 50, 120 50 Z" 
                              fill="rgba(255,255,255,0.1)" 
                              style="mix-blend-mode: overlay; pointer-events: none;" />
                        
                        <!-- Grip Tape Detail (Visible if top view, simplified here) -->
                        <!-- Edge Highlight -->
                        <path d="M 0 20 C 0 20, 100 80, 200 90 L 600 90 C 700 80, 800 20, 800 20 C 800 -10, 720 -30, 680 -20 L 120 -20 C 80 -30, 0 -10, 0 20 Z" 
                              fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                    </g>
                    
                    <!-- Bolts (Subtle detail) -->
                    <g fill="#888" stroke="#333" stroke-width="0.5">
                        <circle cx="180" cy="85" r="3"/>
                        <circle cx="180" cy="75" r="3"/>
                        <circle cx="620" cy="85" r="3"/>
                        <circle cx="620" cy="75" r="3"/>
                    </g>
                </g>
            </svg>