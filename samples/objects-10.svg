<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="250" fill="#87CEEB"/>
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#555"/>
  <line x1="0" y1="275" x2="400" y2="275" stroke="#FFF" stroke-width="2" stroke-dasharray="15,10"/>
  
  <!-- Canopy supports -->
  <rect x="60" y="80" width="12" height="170" fill="#888"/>
  <rect x="328" y="80" width="12" height="170" fill="#888"/>
  
  <!-- Canopy roof -->
  <rect x="40" y="60" width="320" height="30" fill="#E53935"/>
  <rect x="40" y="85" width="320" height="8" fill="#FFF"/>
  
  <!-- Sign -->
  <rect x="150" y="20" width="100" height="40" fill="#FFC107" stroke="#000" stroke-width="2"/>
  <text x="200" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000">FUEL</text>
  
  <!-- Station building -->
  <rect x="250" y="140" width="100" height="110" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
  <rect x="265" y="160" width="30" height="40" fill="#4FC3F7" stroke="#333" stroke-width="1.5"/>
  <rect x="310" y="160" width="30" height="40" fill="#4FC3F7" stroke="#333" stroke-width="1.5"/>
  <rect x="285" y="210" width="30" height="40" fill="#6D4C41" stroke="#333" stroke-width="1.5"/>
  <circle cx="310" cy="230" r="2" fill="#FFD700"/>
  
  <!-- Fuel pump -->
  <rect x="110" y="160" width="50" height="90" fill="#FF5722" stroke="#000" stroke-width="2"/>
  <rect x="118" y="170" width="34" height="25" fill="#212121"/>
  <rect x="122" y="175" width="26" height="15" fill="#76FF03"/>
  <line x1="125" y1="180" x2="145" y2="180" stroke="#000" stroke-width="1"/>
  <line x1="125" y1="185" x2="140" y2="185" stroke="#000" stroke-width="1"/>
  
  <!-- Pump nozzle and hose -->
  <path d="M 160 200 Q 180 210 175 230" stroke="#000" stroke-width="3" fill="none"/>
  <rect x="170" y="228" width="12" height="18" fill="#333"/>
  
  <!-- Small details on pump -->
  <rect x="118" y="200" width="34" height="6" fill="#FFF"/>
  <text x="135" y="205.5" font-family="Arial" font-size="5" text-anchor="middle" fill="#000">95</text>
</svg>