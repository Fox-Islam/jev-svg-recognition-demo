<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle (optional podcast badge style) -->
  <circle cx="32" cy="32" r="30" fill="#6B4EE6"/>
  
  <!-- Microphone body -->
  <rect x="26" y="12" width="12" height="22" rx="6" fill="#FFFFFF"/>
  
  <!-- Microphone grille lines -->
  <line x1="29" y1="18" x2="35" y2="18" stroke="#6B4EE6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="22" x2="35" y2="22" stroke="#6B4EE6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="26" x2="35" y2="26" stroke="#6B4EE6" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Microphone arc/stand holder -->
  <path d="M 20 28 v 4 a 12 12 0 0 0 24 0 v -4" 
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stand stem -->
  <line x1="32" y1="44" x2="32" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stand base -->
  <line x1="25" y1="50" x2="39" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>