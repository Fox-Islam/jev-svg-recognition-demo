<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 450" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for the sword -->
    <filter id="shadow" x="-50%" y="-20%" width="200%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Main Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b4c1a"/>
      <stop offset="15%" stop-color="#f5c542"/>
      <stop offset="25%" stop-color="#fff4b3"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="85%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#6b4c1a"/>
    </linearGradient>

    <!-- Blade Specific Left-to-Right Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b4c1a"/>
      <stop offset="20%" stop-color="#f5c542"/>
      <stop offset="35%" stop-color="#fff4b3"/>
      <stop offset="60%" stop-color="#f5c542"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="90%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#6b4c1a"/>
    </linearGradient>

    <!-- Grip Wrapping Gradient -->
    <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2e15"/>
      <stop offset="20%" stop-color="#8b5a2b"/>
      <stop offset="50%" stop-color="#4a2e15"/>
      <stop offset="80%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#4a2e15"/>
    </linearGradient>

    <!-- Aura Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#FFD700" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <!-- Gem Gradient -->
    <radialGradient id="gemGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#4d0000"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d0f14" />

  <!-- Magic Aura -->
  <circle cx="100" cy="220" r="160" fill="url(#auraGlow)" />

  <!-- Floating Gold Particles -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="45" cy="70" r="1.5" />
    <circle cx="150" cy="60" r="2.5" />
    <circle cx="35" cy="180" r="2" />
    <circle cx="165" cy="150" r="1" />
    <circle cx="50" cy="320" r="2" />
    <circle cx="155" cy="300" r="1.5" />
    <circle cx="70" cy="400" r="1" />
    <circle cx="130" cy="420" r="2" />
    <circle cx="110" cy="40" r="1" />
    <circle cx="85" cy="50" r="2" opacity="0.4" />
  </g>

  <!-- Golden Sword -->
  <g id="sword" filter="url(#shadow)">
    
    <!-- Blade -->
    <polygon points="100,30 90,120 78,250 122,250 110,120" fill="url(#bladeGrad)" />
    
    <!-- Blade Edge Highlight -->
    <polygon points="100,30 90,120 78,250 80,250 90,120 100,45" fill="white" opacity="0.3" />
    <polygon points="100,30 110,120 122,250 120,250 110,120 100,45" fill="white" opacity="0.1" />

    <!-- Blade Fuller (Center Groove) -->
    <polygon points="100,55 97,240 103,240 100,55" fill="#4a2e15" opacity="0.6" />
    <polygon points="100,55 98,240 99,240 100,55" fill="white" opacity="0.2" />

    <!-- Guard -->
    <!-- Center Block -->
    <rect x="84" y="250" width="32" height="15" rx="4" fill="url(#goldGrad)" />
    <!-- Left Arm -->
    <path d="M 84 255 L 55 248 L 45 262 L 84 262 Z" fill="url(#goldGrad)" />
    <!-- Right Arm -->
    <path d="M 116 255 L 145 248 L 155 262 L 116 262 Z" fill="url(#goldGrad)" />

    <!-- Guard Accents / Highlights -->
    <rect x="84" y="254" width="32" height="3" fill="white" opacity="0.5" />
    <path d="M 84 257 L 55 250 L 45 264 L 84 264 Z" fill="white" opacity="0.2" />
    <path d="M 116 257 L 145 250 L 155 264 L 116 264 Z" fill="white" opacity="0.1" />

    <!-- Guard Finials (Ornamental gems or knobs) -->
    <circle cx="45" cy="260" r="5" fill="url(#gemGrad)" />
    <circle cx="44" cy="258" r="1.5" fill="white" opacity="0.8" />
    <circle cx="155" cy="260" r="5" fill="url(#gemGrad)" />
    <circle cx="154" cy="258" r="1.5" fill="white" opacity="0.8" />

    <!-- Grip Base -->
    <rect x="92" y="265" width="16" height="80" rx="2" fill="url(#wrapGrad)" />

    <!-- Grip Gold Wraps -->
    <rect x="92" y="275" width="16" height="8" fill="url(#goldGrad)" />
    <rect x="92" y="295" width="16" height="8" fill="url(#goldGrad)" />
    <rect x="92" y="315" width="16" height="8" fill="url(#goldGrad)" />
    <rect x="92" y="335" width="16" height="8" fill="url(#goldGrad)" />

    <!-- Grip Wrap Highlights -->
    <rect x="92" y="276" width="16" height="2" fill="white" opacity="0.4" />
    <rect x="92" y="296" width="16" height="2" fill="white" opacity="0.4" />
    <rect x="92" y="316" width="16" height="2" fill="white" opacity="0.4" />
    <rect x="92" y="336" width="16" height="2" fill="white" opacity="0.4" />

    <!-- Pommel -->
    <path d="M 86 345 L 114 345 L 120 375 Q 100 395 80 375 Z" fill="url(#goldGrad)" />
    <path d="M 88 345 L 112 345 L 116 370 Q 100 385 84 370 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" />

    <!-- Pommel Gem Setting -->
    <circle cx="100" cy="375" r="10" fill="#2c1a0e" />
    <circle cx="100" cy="375" r="8" fill="url(#gemGrad)" />
    <circle cx="97" cy="372" r="3" fill="white" opacity="0.8" />
    <path d="M 94 378 L 106 378" stroke="white" stroke-width="1.5" opacity="0.5" />

  </g>
</svg>