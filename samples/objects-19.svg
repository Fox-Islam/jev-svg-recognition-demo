    <path d="M152 292C136 331 178 352 156 391C136 428 169 449 146 482"/>
    <path d="M204 292C220 329 181 353 206 392C230 429 195 451 218 482"/>
    <path d="M256 292C235 336 279 365 254 406C237 435 263 457 248 482"/>
    <path d="M308 292C290 328 326 359 301 396C278 430 314 451 292 482"/>
    <path d="M360 292C378 332 336 354 358 394C378 431 346 452 368 482"/>
  </g>

  <!-- Small inner tendrils -->
  <g fill="none" stroke="#DFA7FF" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M181 302C190 335 162 356 176 389"/>
    <path d="M235 302C222 336 246 360 230 396"/>
    <path d="M281 302C296 338 270 361 288 398"/>
    <path d="M333 302C321 333 350 359 334 392"/>
