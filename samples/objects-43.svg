<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for the blade -->
    <linearGradient id="bladeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFF8DC"/>
      <stop offset="75%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Gold gradient for the guard -->
    <linearGradient id="guardGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    
    <!-- Handle gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    
    <!-- Radial gradient for pommel gem -->
    <radialGradient id="gemGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="60%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </radialGradient>
  </defs>

  <!-- Blade -->
  <path d="M 100 10 
           L 112 40 
           L 112 240 
           L 100 250 
           L 88 240 
           L 88 40 
           Z" 
        fill="url(#bladeGold)" 
        stroke="#8B6914" 
        stroke-width="1.5"/>
  
  <!-- Blade center ridge (fuller) -->
  <line x1="100" y1="25" x2="100" y2="240" 
        stroke="#B8860B" stroke-width="2" opacity="0.6"/>
  
  <!-- Blade shine highlight -->
  <path d="M 95 35 L 95 230" 
        stroke="#FFFFFF" stroke-width="2" 
        opacity="0.5" stroke-linecap="round"/>

  <!-- Crossguard -->
  <path d="M 55 250 
           Q 55 244 62 244 
           L 138 244 
           Q 145 244 145 250 
           Q 145 258 138 258 
           L 62 258 
           Q 55 258 55 250 Z" 
        fill="url(#guardGold)" 
        stroke="#8B6914" 
        stroke-width="1.5"/>
  
  <!-- Guard end ornaments -->
  <circle cx="58" cy="251" r="7" fill="url(#guardGold)" stroke="#8B6914" stroke-width="1.5"/>
  <circle cx="142" cy="251" r="7" fill="url(#guardGold)" stroke="#8B6914" stroke-width="1.5"/>

  <!-- Handle -->
  <rect x="92" y="258" width="16" height="80" rx="4" 
        fill="url(#handleGrad)" 
        stroke="#3E2412" 
        stroke-width="1.5"/>
  
  <!-- Handle wrapping -->
  <line x1="92" y1="270" x2="108" y2="276" stroke="#3E2412" stroke-width="2"/>
  <line x1="92" y1="282" x2="108" y2="288" stroke="#3E2412" stroke-width="2"/>
  <line x1="92" y1="294" x2="108" y2="300" stroke="#3E2412" stroke-width="2"/>
  <line x1="92" y1="306" x2="108" y2="312" stroke="#3E2412" stroke-width="2"/>
  <line x1="92" y1="318" x2="108" y2="324" stroke="#3E2412" stroke-width="2"/>

  <!-- Pommel -->
  <circle cx="100" cy="352" r="16" 
          fill="url(#guardGold)" 
          stroke="#8B6914" 
          stroke-width="1.5"/>
  
  <!-- Pommel gem -->
  <circle cx="100" cy="352" r="8" 
          fill="url(#gemGrad)" 
          stroke="#5C0000" 
          stroke-width="1"/>
  
  <!-- Gem highlight -->
  <circle cx="97" cy="349" r="2.5" fill="#FFB6B6" opacity="0.8"/>

  <!-- Sparkles on blade -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M 107 70 l 2 5 l 5 2 l -5 2 l -2 5 l -2 -5 l -5 -2 l 5 -2 Z"/>
    <path d="M 93 150 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 l 4 -1.5 Z"/>
  </g>
</svg>