  <!-- Stem -->
  <path d="M108 30 Q112 15 110 5" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Apple body -->
  <path d="
    M 60 55
    Q 20 55 15 100
    Q 10 145 40 175
    Q 60 195 100 195
    Q 140 195 160 175
    Q 190 145 185 100
    Q 180 55 140 55
    Q 125 45 108 50
    Q 90 45 60 55 Z
  " fill="#E53935" />

  <!-- Bite chunk removed (white background or transparent) -->
