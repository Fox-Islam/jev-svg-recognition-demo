<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Tent Roof Clip Path (Scalloped Bottom) -->
    <clipPath id="roofClip">
      <path d="M 60 250 Q 200 70 340 250 Q 330 270 290 250 Q 250 270 210 250 Q 170 270 130 250 Q 90 270 60 250 Z" />
    </clipPath>

    <!-- Tent Walls Clip Path (Scalloped Top) -->
    <clipPath id="wallClip">
      <path d="M 60 250 Q 90 270 130 250 Q 170 270 210 250 Q 250 270 290 250 Q 330 270 340 250 L 340 350 L 60 350 Z" />
    </clipPath>
  </defs>

  <!-- Background Layer -->
  <circle cx="200" cy="200" r="200" fill="url(#glow)" />
  <ellipse cx="200" cy="350" rx="180" ry="40" fill="#2B9348" />
  <ellipse cx="200" cy="350" rx="140" ry="25" fill="#1A4314" opacity="0.5" />

  <!-- Guy Ropes (Background) -->
  <line x1="200" y1="30" x2="40" y2="380" stroke="#F8F9FA" stroke-width="2" opacity="0.6" />
  <line x1="200" y1="30" x2="360" y2="380" stroke="#F8F9FA" stroke-width="2" opacity="0.6" />
  
  <!-- Pennants on Guy Ropes -->
  <polygon points="120,205 110,215 125,215" fill="#FFC300" />
  <polygon points="280,205 290,215 275,215" fill="#FFC300" />
  <polygon points="80,290 70,300 85,300" fill="#D90429" />
  <polygon points="320,290 330,300 315,300" fill="#D90429" />

  <!-- TENT WALLS -->
  <g clip-path="url(#wallClip)">
    <!-- Wall Stripes (Vertical) -->
    <rect x="60" y="250" width="24" height="100" fill="#D90429" />
    <rect x="84" y="250" width="24" height="100" fill="#FFC300" />
    <rect x="108" y="250" width="24" height="100" fill="#00509E" />
    <rect x="132" y="250" width="24" height="100" fill="#F8F9FA" />
    <rect x="156" y="250" width="24" height="100" fill="#D90429" />
    <rect x="180" y="250" width="24" height="100" fill="#FFC300" />
    <rect x="204" y="250" width="24" height="100" fill="#00509E" />
    <rect x="228" y="250" width="24" height="100" fill="#F8F9FA" />
    <rect x="252" y="250" width="24" height="100" fill="#D90429" />
    <rect x="276" y="250" width="24" height="100" fill="#FFC300" />
    <rect x="300" y="250" width="24" height="100" fill="#00509E" />
    <rect x="324" y="250" width="24" height="100" fill="#F8F9FA" />
  </g>

  <!-- TENT ROOF -->
  <g clip-path="url(#roofClip)">
    <!-- Roof Stripes (Radiating from center) -->
    <g transform="translate(200, 80)">
      <rect x="-10" y="0" width="20" height="300" fill="#D90429" transform="rotate(-50)" />
      <rect x="-10" y="0" width="20" height="300" fill="#FFC300" transform="rotate(-40)" />
      <rect x="-10" y="0" width="20" height="300" fill="#00509E" transform="rotate(-30)" />
      <rect x="-10" y="0" width="20" height="300" fill="#F8F9FA" transform="rotate(-20)" />
      <rect x="-10" y="0" width="20" height="300" fill="#D90429" transform="rotate(-10)" />
      <rect x="-10" y="0" width="20" height="300" fill="#FFC300" transform="rotate(0)" />
      <rect x="-10" y="0" width="20" height="300" fill="#00509E" transform="rotate(10)" />
      <rect x="-10" y="0" width="20" height="300" fill="#F8F9FA" transform="rotate(20)" />
      <rect x="-10" y="0" width="20" height="300" fill="#D90429" transform="rotate(30)" />
      <rect x="-10" y="0" width="20" height="300" fill="#FFC300" transform="rotate(40)" />
      <rect x="-10" y="0" width="20" height="300" fill="#00509E" transform="rotate(50)" />
    </g>
  </g>

  <!-- 3D Shadows (Right Side) -->
  <!-- Roof Shadow -->
  <path d="M 200 80 Q 200 70 340 250 Q 330 270 290 250 Q 250 270 210 250 Z" fill="#000000" opacity="0.15" />
  <!-- Wall Shadow -->
  <path d="M 210 250 Q 250 270 290 250 Q 330 270 340 250 L 340 350 L 210 350 Z" fill="#000000" opacity="0.15" />

  <!-- SIDE POLES -->
  <!-- Left Pole -->
  <rect x="55" y="250" width="10" height="100" fill="#E0E1DD" rx="3" />
  <circle cx="60" cy="250" r="8" fill="#FFC300" />
  <!-- Right Pole -->
  <rect x="335" y="250" width="10" height="100" fill="#E0E1DD" rx="3" />
  <circle cx="340" cy="250" r="8" fill="#FFC300" />

  <!-- ENTRANCE ARCHWAY -->
  <!-- Interior Depth -->
  <path d="M 160 350 L 160 280 A 40 40 0 0 1 240 280 L 240 350 Z" fill="#2B2D42" />
  <path d="M 165 350 L 165 285 A 35 35 0 0 1 235 285 L 235 350 Z" fill="#1A1A24" />
  
  <!-- Entrance Curtains -->
  <path d="M 160 280 Q 140 300 150 350 L 160 350 Z" fill="#D90429" />
  <path d="M 240 280 Q 260 300 250 350 L 240 350 Z" fill="#D90429" />
  
  <!-- Curtain Tiebacks -->
  <rect x="145" y="310" width="15" height="6" fill="#FFC300" rx="3" />
  <rect x="240" y="310" width="15" height="6" fill="#FFC300" rx="3" />

  <!-- Entrance Valance (Awning) -->
  <path d="M 145 270 L 145 280 Q 160 290 200 280 Q 240 290 255 280 L 255 270 Q 240 260 200 270 Q 160 260 145 270 Z" fill="#00509E" />
  <!-- Valance Fringe -->
  <path d="M 145 280 Q 160 290 200 280 Q 240 290 255 280" fill="none" stroke="#FFC300" stroke-width="4" stroke-dasharray="4,4" />

  <!-- "CIRCUS" Text -->
  <text x="202" y="267" font-family="'Arial Black', Impact, sans-serif" font-size="24" fill="#000000" text-anchor="middle" font-weight="bold" letter-spacing="4" opacity="0.3">CIRCUS</text>
  <text x="200" y="265" font-family="'Arial Black', Impact, sans-serif" font-size="24" fill="#F8F9FA" text-anchor="middle" font-weight="bold" letter-spacing="4">CIRCUS</text>

  <!-- TOP PINNACLE / FLAGPOLE -->
  <!-- Center Pole -->
  <rect x="196" y="30" width="8" height="50" fill="#E0E1DD" />
  <circle cx="200" cy="80" r="12" fill="#D90429" />
  <!-- Finial (Ball on Top) -->
  <circle cx="200" cy="25" r="7" fill="#FFC300" />
  
  <!-- Waving Flags -->
  <path d="M 197 25 Q 180 20 165 30 L 197 40 Z" fill="#00509E" />
  <path d="M 203 25 Q 220 20 235 30 L 203 40 Z" fill="#D90429" />

  <!-- BUNTING / FESTIVE STRINGS -->
  <!-- Left Bunting -->
  <path d="M 60 250 Q 30 280 20 380" fill="none" stroke="#F8F9FA" stroke-width="1.5" />
  <polygon points="50,260 45,275 55,270" fill="#D90429" />
  <polygon points="40,285 35,300 45,295" fill="#00509E" />
  <polygon points="30,310 25,325 35,320" fill="#FFC300" />
  
  <!-- Right Bunting -->
  <path d="M 340 250 Q 370 280 380 380" fill="none" stroke="#F8F9FA" stroke-width="1.5" />
  <polygon points="350,260 345,275 355,270" fill="#00509E" />
  <polygon points="360,285 355,300 365,295" fill="#D90429" />
  <polygon points="370,310 365,325 375,320" fill="#FFC300" />

  <!-- SPARKLES / MAGICAL EFFECTS -->
  <path d="M 100 100 Q 110 110 120 100 Q 110 90 100 100 Z" fill="#FFC300" />
  <path d="M 300 120 Q 310 130 320 120 Q 310 110 300 120 Z" fill="#FFC300" />
  <path d="M 80 180 Q 90 190 100 180 Q 90 170 80 180 Z" fill="#D90429" />
  <path d="M 320 200 Q 330 210 340 200 Q 330 190 320 200 Z" fill="#D90429" />
  
  <!-- Spotlight Effect -->
  <polygon points="200,0 120,350 280,350" fill="#FFFFFF" opacity="0.05" />
  <polygon points="200,0 160,350 240,350" fill="#FFFFFF" opacity="0.05" />
</svg>