<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jellyfish Icon</title>
  <desc id="desc">A cute purple jellyfish with a rounded bell, face, and flowing tentacles.</desc>

  <defs>
    <linearGradient id="bellGradient" x1="256" y1="72" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8F1FF"/>
      <stop offset="0.55" stop-color="#9D8CFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>

    <linearGradient id="tentacleGradient" x1="256" y1="292" x2="256" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#FF7AD9"/>
    </linearGradient>
  </defs>

  <!-- Bell -->
  <path
    d="M104 246C104 148 172 72 256 72C340 72 408 148 408 246C408 272 386 294 360 294C342 294 330 278 320 258C310 278 298 294 280 294C262 294 250 278 240 258C230 278 218 294 200 294C182 294 170 278 160 258C150 278 138 294 120 294C111 294 104 287 104 278Z"
    fill="url(#bellGradient)"
    stroke="#4E35B1"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- Shine -->
  <path
    d="M159 213C171 150 214 113 267 106"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.45"
  />

