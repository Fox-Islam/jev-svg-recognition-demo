<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Popcorn piece gradient -->
    <radialGradient id="popcornGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="60%" stop-color="#fdf0c2"/>
      <stop offset="100%" stop-color="#f0d98a"/>
    </radialGradient>
    <radialGradient id="popcornGrad2" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff8d9"/>
      <stop offset="60%" stop-color="#f7e3a5"/>
      <stop offset="100%" stop-color="#e8c976"/>
    </radialGradient>
    <!-- A reusable popcorn piece -->
    <g id="kernel">
      <circle cx="0" cy="0" r="13" fill="url(#popcornGrad)"/>
      <circle cx="-11" cy="-6" r="10" fill="url(#popcornGrad)"/>
      <circle cx="11" cy="-6" r="10" fill="url(#popcornGrad2)"/>
      <circle cx="0" cy="-13" r="10" fill="url(#popcornGrad)"/>
      <circle cx="-6" cy="6" r="9" fill="url(#popcornGrad2)"/>
      <circle cx="7" cy="6" r="9" fill="url(#popcornGrad)"/>
      <circle cx="0" cy="-4" r="6" fill="#e9c87a" opacity="0.5"/>
    </g>
  </defs>

  <!-- Background popcorn (behind bucket rim) -->
  <use href="#kernel" x="105" y="135" transform="rotate(-15 105 135)"/>
  <use href="#kernel" x="150" y="110"/>
  <use href="#kernel" x="200" y="100" transform="rotate(20 200 100) scale(1.1)"/>
  <use href="#kernel" x="250" y="112" transform="rotate(-10 250 112)"/>
  <use href="#kernel" x="295" y="138" transform="rotate(30 295 138)"/>
  <use href="#kernel" x="128" y="125" transform="rotate(45 128 125) scale(0.9)"/>
  <use href="#kernel" x="175" y="118" transform="rotate(-30 175 118) scale(0.95)"/>
  <use href="#kernel" x="225" y="120" transform="rotate(15 225 120)"/>
  <use href="#kernel" x="272" y="124" transform="rotate(-25 272 124) scale(0.9)"/>

  <!-- Flying kernels -->
  <use href="#kernel" x="320" y="70" transform="rotate(25 320 70) scale(0.6)"/>
  <use href="#kernel" x="90" y="80" transform="rotate(-40 90 80) scale(0.55)"/>
  <use href="#kernel" x="230" y="50" transform="rotate(60 230 50) scale(0.5)"/>

  <!-- Bucket body -->
  <path d="M 95 155 L 130 440 Q 200 455 270 440 L 305 155 Z" fill="#e8e2d4"/>

  <!-- Red stripes -->
  <path d="M 95 155 L 119 155 L 151 443 Q 138 441.5 130 440 Z" fill="#d62828"/>
  <path d="M 143 155 L 167 155 L 188 449 Q 175 448 172 447.5 Z" fill="#d62828"/>
  <path d="M 191 155 L 215 155 L 222 450 Q 209 450.5 198 450 Z" fill="#d62828"/>
  <path d="M 239 155 L 263 155 L 246 446 Q 236 448 232 448.5 Z" fill="#d62828"/>
  <path d="M 287 155 L 305 155 L 270 440 Q 262 441.5 255 443 Z" fill="#d62828"/>

  <!-- Subtle shading on bucket -->
  <path d="M 95 155 L 130 440 Q 200 455 270 440 L 305 155 Z" fill="black" opacity="0.06"/>
  <path d="M 110 160 L 140 435 Q 200 448 262 435 L 292 160 Z" fill="white" opacity="0.08"/>

  <!-- Bucket rim -->
  <path d="M 88 140 Q 200 165 312 140 L 309 165 Q 200 188 91 165 Z" fill="#f4f0e6"/>
  <path d="M 88 140 Q 200 165 312 140 L 311 150 Q 200 174 89 150 Z" fill="#ffffff"/>
  <path d="M 91 165 Q 200 188 309 165 L 308 172 Q 200 194 92 172 Z" fill="#c9c2b0" opacity="0.6"/>

  <!-- Front popcorn spilling over the rim -->
  <use href="#kernel" x="115" y="158" transform="rotate(20 115 158) scale(0.85)"/>
  <use href="#kernel" x="160" y="150" transform="rotate(-15 160 150) scale(0.9)"/>
  <use href="#kernel" x="205" y="155" transform="rotate(35 205 155)"/>
  <use href="#kernel" x="250" y="148" transform="rotate(-20 250 148) scale(0.9)"/>
  <use href="#kernel" x="288" y="158" transform="rotate(10 288 158) scale(0.8)"/>
  <use href="#kernel" x="138" y="165" transform="rotate(-45 138 165) scale(0.7)"/>
  <use href="#kernel" x="230" y="165" transform="rotate(50 230 165) scale(0.75)"/>

  <!-- "POPCORN" label -->
  <ellipse cx="200" cy="290" rx="78" ry="46" fill="#ffd23f" stroke="#d62828" stroke-width="6"/>
  <text x="200" y="300" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#d62828" text-anchor="middle">POPCORN</text>

  <!-- Single dropped kernel -->
  <use href="#kernel" x="330" y="430" transform="rotate(-30 330 430) scale(0.6)"/>
</svg>