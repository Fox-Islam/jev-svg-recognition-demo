<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone case body -->
  <rect x="20" y="20" width="160" height="360" rx="30" ry="30" 
        fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
  
  <!-- Inner cutout for screen area -->
  <rect x="30" y="30" width="140" height="340" rx="22" ry="22" 
        fill="#34495e" stroke="none"/>
  
  <!-- Camera module background -->
  <rect x="40" y="40" width="70" height="70" rx="15" ry="15" 
        fill="#1a252f"/>
  
  <!-- Camera lens 1 -->
  <circle cx="62" cy="62" r="14" fill="#2c3e50" stroke="#0f1419" stroke-width="2"/>
  <circle cx="62" cy="62" r="8" fill="#0f1419"/>
  <circle cx="59" cy="59" r="3" fill="#4a6278"/>
  
  <!-- Camera lens 2 -->
  <circle cx="88" cy="88" r="14" fill="#2c3e50" stroke="#0f1419" stroke-width="2"/>
  <circle cx="88" cy="88" r="8" fill="#0f1419"/>
  <circle cx="85" cy="85" r="3" fill="#4a6278"/>
  
  <!-- Flash -->
  <circle cx="88" cy="62" r="5" fill="#f1c40f"/>
  
  <!-- Side buttons -->
  <rect x="16" y="100" width="6" height="40" rx="3" ry="3" fill="#1a252f"/>
  <rect x="16" y="150" width="6" height="25" rx="3" ry="3" fill="#1a252f"/>
  <rect x="178" y="120" width="6" height="50" rx="3" ry="3" fill="#1a252f"/>
  
  <!-- Subtle highlight -->
  <rect x="35" y="35" width="20" height="320" rx="10" ry="10" 
        fill="#ffffff" opacity="0.05"/>
</svg>