<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  
  <!-- Paper background -->
  <rect x="20" y="20" width="460" height="610" rx="4" ry="4" 
        fill="#f5f0e8" stroke="#c8b89a" stroke-width="2"/>
  
  <!-- Paper shadow -->
  <rect x="25" y="25" width="460" height="610" rx="4" ry="4" 
        fill="#d4c9b0" opacity="0.4"/>
  
  <!-- Main paper on top -->
  <rect x="20" y="20" width="460" height="610" rx="4" ry="4" 
        fill="#faf7f0" stroke="#b8a882" stroke-width="1.5"/>

  <!-- ===== HEADER ===== -->
  <!-- Header background -->
  <rect x="20" y="20" width="460" height="80" rx="4" ry="4" 
        fill="#1a1a2e" />

  <!-- Newspaper Name -->
  <text x="250" y="62" 
        font-family="Georgia, serif" font-size="36" font-weight="bold"
        fill="#f5f0e8" text-anchor="middle" letter-spacing="6">
    THE DAILY TIMES
  </text>

  <!-- Tagline -->
  <text x="250" y="82" 
        font-family="Georgia, serif" font-size="11" font-style="italic"
        fill="#c8b89a" text-anchor="middle" letter-spacing="2">
    "All the News That's Fit to Print"
  </text>

  <!-- Header decorative lines -->
  <line x1="30" y1="91" x2="470" y2="91" stroke="#c8b89a" stroke-width="1.5"/>
  <line x1="30" y1="94" x2="470" y2="94" stroke="#c8b89a" stroke-width="0.5"/>

  <!-- Date and Edition info -->
  <text x="35" y="107" 
        font-family="Arial, sans-serif" font-size="9" fill="#444">
    VOL. CXLII . . No. 49,285
  </text>
  <text x="250" y="107" 
        font-family="Arial, sans-serif" font-size="9" fill="#444" text-anchor="middle">
    TUESDAY, JUNE 17, 2025
  </text>
  <text x="465" y="107" 
        font-family="Arial, sans-serif" font-size="9" fill="#444" text-anchor="end">
    PRICE: $2.50
  </text>

  <!-- Thin divider line below date -->
  <line x1="30" y1="112" x2="470" y2="112" stroke="#888" stroke-width="0.7"/>

  <!-- ===== MAIN HEADLINE ===== -->
  <text x="250" y="140" 
        font-family="Georgia, serif" font-size="30" font-weight="bold"
        fill="#1a1a2e" text-anchor="middle" letter-spacing="1">
    WORLD LEADERS GATHER
  </text>
  <text x="250" y="165" 
        font-family="Georgia, serif" font-size="30" font-weight="bold"
        fill="#1a1a2e" text-anchor="middle" letter-spacing="1">
    FOR HISTORIC SUMMIT
  </text>

  <!-- Sub-headline -->
  <text x="250" y="183" 
        font-family="Georgia, serif" font-size="13" font-style="italic"
        fill="#555" text-anchor="middle">
    Global leaders meet to discuss climate, economy, and world peace
  </text>

  <!-- Divider -->
  <line x1="30" y1="191" x2="470" y2="191" stroke="#888" stroke-width="0.7"/>

  <!-- ===== THREE COLUMN LAYOUT ===== -->

  <!-- Column dividers -->
  <line x1="183" y1="195" x2="183" y2="430" stroke="#bbb" stroke-width="0.8"/>
  <line x1="317" y1="195" x2="317" y2="430" stroke="#bbb" stroke-width="0.8"/>

  <!-- === COLUMN 1 === -->
  <!-- Image placeholder -->
  <rect x="32" y="198" width="143" height="90" fill="#d4cfc4" rx="2"/>
  <line x1="32" y1="198" x2="175" y2="288" stroke="#bbb" stroke-width="1"/>
  <line x1="175" y1="198" x2="32" y2="288" stroke="#bbb" stroke-width="1"/>
  <text x="103" y="249" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">[PHOTO]</text>
  <text x="103" y="298" font-family="Arial" font-size="7.5" fill="#555" text-anchor="middle" font-style="italic">
    Leaders at the summit venue.
  </text>

  <!-- Col 1 text lines -->
  <text x="35" y="314" font-family="Georgia, serif" font-size="9" fill="#222" font-weight="bold">GENEVA, Switzerland —</text>
  <text x="35" y="328" font-family="Georgia, serif" font-size="9" fill="#333">Representatives from over</text>
  <text x="35" y="341" font-family="Georgia, serif" font-size="9" fill="#333">fifty nations convened yes-</text>
  <text x="35" y="354" font-family="Georgia, serif" font-size="9" fill="#333">terday for what analysts</text>
  <text x="35" y="367" font-family="Georgia, serif" font-size="9" fill="#333">are calling the most sig-</text>
  <text x="35" y="380" font-family="Georgia, serif" font-size="9" fill="#333">nificant gathering of world</text>
  <text x="35" y="393" font-family="Georgia, serif" font-size="9" fill="#333">leaders in recent memory.</text>
  <text x="35" y="406" font-family="Georgia, serif" font-size="9" fill="#333">The agenda spans three</text>
  <text x="35" y="419" font-family="Georgia, serif" font-size="9" fill="#333">days of negotiations...</text>

  <!-- === COLUMN 2 === -->
  <text x="192" y="210" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1a1a2e">Climate Crisis</text>
  <text x="192" y="225" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1a1a2e">Takes Center Stage</text>
  <line x1="192" y1="230" x2="308" y2="230" stroke="#999" stroke-width="0.6"/>

  <text x="192" y="245" font-family="Georgia, serif" font-size="9" fill="#333">Climate change remains</text>
  <text x="192" y="258" font-family="Georgia, serif" font-size="9" fill="#333">the top priority as dele-</text>
  <text x="192" y="271" font-family="Georgia, serif" font-size="9" fill="#333">gates push for binding</text>
  <text x="192" y="284" font-family="Georgia, serif" font-size="9" fill="#333">emissions targets by the</text>
  <text x="192" y="297" font-family="Georgia, serif" font-size="9" fill="#333">year 2035. Scientists warn</text>
  <text x="192" y="310" font-family="Georgia, serif" font-size="9" fill="#333">that time is running out</text>
  <text x="192" y="323" font-family="Georgia, serif" font-size="9" fill="#333">to prevent irreversible</text>
  <text x="192" y="336" font-family="Georgia, serif" font-size="9" fill="#333">damage to ecosystems.</text>
  <text x="192" y="349" font-family="Georgia, serif" font-size="9" fill="#333">New proposals include</text>
  <text x="192" y="362" font-family="Georgia, serif" font-size="9" fill="#333">a global carbon tax and</text>
  <text x="192" y="375" font-family="Georgia, serif" font-size="9" fill="#333">renewable energy funds.</text>
  <text x="192" y="388" font-family="Georgia, serif" font-size="9" fill="#333">Several nations have al-</text>
  <text x="192" y="401" font-family="Georgia, serif" font-size="9" fill="#333">ready pledged support.</text>
  <text x="192" y="414" font-family="Georgia, serif" font-size="9" fill="#333">Talks continue today...</text>

  <!-- === COLUMN 3 === -->
  <text x="326" y="210" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1a1a2e">Economy &amp;</text>
  <text x="326" y="225" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1a1a2e">Trade Disputes</text>
  <line x1="326" y1="230" x2="462" y2="230" stroke="#999" stroke-width="0.6"/>

  <text x="326" y="245" font-family="Georgia, serif" font-size="9" fill="#333">Trade tensions between</text>
  <text x="326" y="258" font-family="Georgia, serif" font-size="9" fill="#333">major economies have</text>
  <text x="326" y="271" font-family="Georgia, serif" font-size="9" fill="#333">prompted urgent calls</text>
  <text x="326" y="284" font-family="Georgia, serif" font-size="9" fill="#333">for a unified framework.</text>
  <text x="326" y="297" font-family="Georgia, serif" font-size="9" fill="#333">Finance ministers met</text>
  <text x="326" y="310" font-family="Georgia, serif" font-size="9" fill="#333">behind closed doors to</text>
  <text x="326" y="323" font-family="Georgia, serif" font-size="9" fill="#333">address tariff disputes.</text>
  <text x="326" y="336" font-family="Georgia, serif" font-size="9" fill="#333">Markets responded pos-</text>
  <text x="326" y="349" font-family="Georgia, serif" font-size="9" fill="#333">itively to early signs of</text>
  <text x="326" y="362" font-family="Georgia, serif" font-size="9" fill="#333">progress, with global</text>
  <text x="326" y="375" font-family="Georgia, serif" font-size="9" fill="#333">indices rising sharply.</text>
  <text x="326" y="388" font-family="Georgia, serif" font-size="9" fill="#333">Economists remain cau-</text>
  <text x="326" y="401" font-family="Georgia, serif" font-size="9" fill="#333">tiously optimistic about</text>
  <text x="326" y="414" font-family="Georgia, serif" font-size="9" fill="#333">the outcome of talks...</text>

  <!-- ===== LOWER SECTION DIVIDER ===== -->
  <line x1="30" y1="433" x2="470" y2="433" stroke="#888" stroke-width="1.2"/>
  <line x1="30" y1="436" x2="470" y2="436" stroke="#888" stroke-width="0.4"/>

  <!-- ===== BOTTOM TWO COLUMNS ===== -->
  <line x1="255" y1="440" x2="255" y2="560" stroke="#bbb" stroke-width="0.8"/>

  <!-- Bottom Left Story -->
  <text x="35" y="455" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1a1a2e">
    Technology Stocks Surge
  </text>
  <line x1="35" y1="460" x2="245" y2="460" stroke="#999" stroke-width="0.6"/>
  <text x="35" y="474" font-family="Georgia, serif" font-size="9" fill="#333">Major tech firms reported record</text>
  <text x="35" y="487" font-family="Georgia, serif" font-size="9" fill="#333">earnings this quarter, driven by</text>
  <text x="35" y="500" font-family="Georgia, serif" font-size="9" fill="#333">AI investments and cloud services.</text>
  <text x="35" y="513" font-family="Georgia, serif" font-size="9" fill="#333">The NASDAQ climbed 3.2% on</text>
  <text x="35" y="526" font-family="Georgia, serif" font-size="9" fill="#333">Monday as investor confidence</text>
  <text x="35" y="539" font-family="Georgia, serif" font-size="9" fill="#333">reached an all-time high. Analysts</text>
  <text x="35" y="552" font-family="Georgia, serif" font-size="9" fill="#333">predict continued growth ahead.</text>

  <!-- Bottom Right Story -->
  <text x="265" y="455" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1a1a2e">
    Space Mission Launch
  </text>
  <line x1="265" y1="460" x2="465" y2="460" stroke="#999" stroke-width="0.6"/>
  <text x="265" y="474" font-family="Georgia, serif" font-size="9" fill="#333">A new crewed spacecraft blasted</text>
  <text x="265" y="487" font-family="Georgia, serif" font-size="9" fill="#333">off at dawn on Monday, marking</text>
  <text x="265" y="500" font-family="Georgia, serif" font-size="9" fill="#333">a new era of deep space travel.</text>
  <text x="265" y="513" font-family="Georgia, serif" font-size="9" fill="#333">The six-person crew will orbit</text>
  <text x="265" y="526" font-family="Georgia, serif" font-size="9" fill="#333">the Moon before returning home</text>
  <text x="265" y="539" font-family="Georgia, serif" font-size="9" fill="#333">after fourteen days. Mission con-</text>
  <text x="265" y="552" font-family="Georgia, serif" font-size="9" fill="#333">trol reports all systems nominal.</text>

  <!-- ===== FOOTER ===== -->
  <line x1="30" y1="565" x2="470" y2="565" stroke="#888" stroke-width="1"/>

  <!-- Small ads / classifieds bar -->
  <rect x="30" y="572" width="130" height="40" fill="#e8e0d0" rx="2" stroke="#bbb" stroke-width="0.8"/>
  <text x="95" y="587" font-family="Arial" font-size="8" font-weight="bold" fill="#333" text-anchor="middle">CLASSIFIED ADS</text>
  <text x="95" y="600" font-family="Arial" font-size="7.5" fill="#555" text-anchor="middle">Call: 1-800-555-NEWS</text>

  <rect x="170" y="572" width="160" height="40" fill="#1a1a2e" rx="2"/>
  <text x="250" y="587" font-family="Georgia, serif" font-size="8" fill="#f5f0e8" text-anchor="middle" font-weight="bold">SUBSCRIBE TODAY</text>
  <text x="250" y="600" font-family="Arial" font-size="7.5" fill="#c8b89a" text-anchor="middle">www.thedailytimes.com</text>

  <rect x="340" y="572" width="130" height="40" fill="#e8e0d0" rx="2" stroke="#bbb" stroke-width="0.8"/>
  <text x="405" y="587" font-family="Arial" font-size="8" font-weight="bold" fill="#333" text-anchor="middle">WEATHER</text>
  <text x="405" y="600" font-family="Arial" font-size="7.5" fill="#555" text-anchor="middle">☀ Sunny, High 24°C</text>

  <!-- Page number -->
  <text x="250" y="624" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">
    — Page 1 of 24 —
  </text>

</svg>