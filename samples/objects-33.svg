<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#c44dff"/>
      <stop offset="100%" stop-color="#4d9fff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Case body -->
  <rect x="20" y="20" width="160" height="360" rx="28" ry="28" fill="url(#caseGrad)" stroke="#2a2a2a" stroke-width="2"/>
  
  <!-- Inner bezel -->
  <rect x="28" y="28" width="144" height="344" rx="22" ry="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- Shine overlay -->
  <rect x="20" y="20" width="160" height="360" rx="28" ry="28" fill="url(#shine)"/>
  
  <!-- Camera module -->
  <rect x="40" y="45" width="70" height="70" rx="16" ry="16" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Camera lenses -->
  <circle cx="60" cy="65" r="11" fill="#222" stroke="#555" stroke-width="1.5"/>
  <circle cx="60" cy="65" r="6" fill="#0a0a1a"/>
  <circle cx="62" cy="63" r="2" fill="#6ab0ff" opacity="0.7"/>
  
  <circle cx="90" cy="65" r="11" fill="#222" stroke="#555" stroke-width="1.5"/>
  <circle cx="90" cy="65" r="6" fill="#0a0a1a"/>
  <circle cx="92" cy="63" r="2" fill="#6ab0ff" opacity="0.7"/>
  
  <circle cx="60" cy="95" r="11" fill="#222" stroke="#555" stroke-width="1.5"/>
  <circle cx="60" cy="95" r="6" fill="#0a0a1a"/>
  <circle cx="62" cy="93" r="2" fill="#6ab0ff" opacity="0.7"/>
  
  <!-- Flash -->
  <circle cx="90" cy="95" r="6" fill="#fffacd" opacity="0.8"/>
  <circle cx="90" cy="95" r="3" fill="white"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.4">
    <circle cx="150" cy="180" r="25" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="150" cy="180" r="15" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="150" cy="180" r="5" fill="white"/>
    
    <circle cx="60" cy="250" r="20" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="100" cy="300" r="15" fill="none" stroke="white" stroke-width="1"/>
    <circle cx="140" cy="330" r="10" fill="none" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Side buttons -->
  <rect x="17" y="80" width="3" height="25" rx="1.5" fill="#3a3a3a"/>
  <rect x="17" y="115" width="3" height="40" rx="1.5" fill="#3a3a3a"/>
  <rect x="180" y="95" width="3" height="50" rx="1.5" fill="#3a3a3a"/>
  
  <!-- Brand mark -->
  <text x="100" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.6" font-weight="bold">CASE</text>
</svg>