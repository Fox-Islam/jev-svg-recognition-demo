    M 140 55
    Q 165 58 172 80
    Q 178 100 165 115
    Q 150 130 135 120
    Q 118 108 125 85
    Q 128 65 140 55 Z
  " fill="#FFCCBC" opacity="0.9"/>

  <!-- Bite shadow/depth -->
  <path d="
    M 140 58
    Q 162 62 168 82
    Q 173 100 161 113
    Q 148 126 136 118
    Q 122 108 128 87
    Q 131 67 140 58 Z
  " fill="none" stroke="#E64A19" stroke-width="1.5" />

  <!-- Apple shine/highlight -->
  <ellipse cx="75" cy="85" rx="18" ry="25" fill="white" opacity="0.2" transform="rotate(-20 75 85)" />
  <ellipse cx="70" cy="80" rx="8" ry="12" fill="white" opacity="0.25" transform="rotate(-20 70 80)" />

  <!-- Apple shadow at bottom -->
